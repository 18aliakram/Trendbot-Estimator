[build]
  base = "."
  command = "npm run build"
  publish = "client/dist"

[functions]
  directory = "netlify/functions"
  external_node_modules = ["express", "serverless-http", "@netlify/blobs", "pdfkit", "bcryptjs", "@google/generative-ai", "cors", "jsonwebtoken", "multer", "dotenv"]
  node_bundler = "esbuild"

[[redirects]]
  force = true
  from = "/api/*"
  status = 200
  to = "/.netlify/functions/api/:splat"

[[redirects]]
  from = "/*"
  status = 200
  to = "/index.html"
